<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Learn any topic through a lively, AI-generated conversation." />
    <title>DoomSchooling - Learn through the feed</title>
    <script>
      // Apply the theme before first paint to avoid a flash. Dark is the default;
      // only an explicit saved "light" choice opts out. Keep in sync with src/lib/theme.ts.
      (function () {
        var isDark = true;
        try {
          isDark = localStorage.getItem('doomschooling:theme') !== 'light';
        } catch (error) {}
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
