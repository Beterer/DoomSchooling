packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  brace-expansion: 5.0.9
  find-my-way: 9.7.0

allowBuilds:
  '@clerk/shared': true
  esbuild: true
  # Its postinstall only prints dependency-version warnings; the package ships
  # the generated runtime files, so no build step is needed.
  protobufjs: false
